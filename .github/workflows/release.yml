name: Release
on:
  push:
    branches:
      # Keep in sync with `branches` in .releaserc.yml.
      - main
      - beta
      - alpha
      - experimental

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          # No dependency cache in a job that publishes: a poisoned cache would
          # run with this job's tokens. setup-node's README advises the same.
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install
      - name: Build package
        run: pnpm build
      - name: Run checks
        run: pnpm check
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm semantic-release
