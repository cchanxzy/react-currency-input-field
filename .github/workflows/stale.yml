name: Close Stale Issues and Pull Requests

on:
  schedule:
    - cron: '0 0 * * *' # Run every day at midnight

permissions:
  issues: write
  pull-requests: write

jobs:
  close_stale_prs:
    runs-on: ubuntu-latest
    steps:
      - name: Close Stale Issues
        uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9.1.0
