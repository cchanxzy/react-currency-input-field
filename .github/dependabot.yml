version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch bumps come as one PR. Each major bump gets its own PR,
      # so a breaking one can be reverted without the others.
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Security updates only: a limit of 0 turns off routine version updates.
    open-pull-requests-limit: 0
    groups:
      # Security fixes for every open alert come as one PR.
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
