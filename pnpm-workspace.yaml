onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - lmdb
  - msgpackr-extract

# unrs-resolver (used by eslint-plugin-import-x) installs its native binding
# as an optional dependency; its postinstall is only a fallback download.
ignoredBuiltDependencies:
  - unrs-resolver

# New dependency versions must be 3 days old before pnpm installs them.
minimumReleaseAge: 4320

overrides:
  form-data@>=4.0.0 <4.0.4: '>=4.0.4'
  # serve 14.2.6 (the latest) pins compression 1.8.1 exactly.
  compression@<1.8.2: '>=1.8.2'

peerDependencyRules:
  allowedVersions:
    # eslint-plugin-react 7.37.5 predates ESLint 10 and declares eslint up
    # to ^9.7. It works with ESLint 10 when the React version is set
    # explicitly in eslint.config.mjs. Remove once a release supports 10.
    eslint-plugin-react>eslint: '10'
